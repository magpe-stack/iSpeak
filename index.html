<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>iSpeak</title>
  <link rel="icon" href="logo.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="header">
    <div class="brand">
      <img src="logo.svg" alt="iSpeak Logo" class="logo-icon">
      <h1 class="brand-title">iSpeak</h1>
    </div>
    <button id="theme-toggle" class="btn-icon" aria-label="Alternar Tema" title="Alternar Tema">
      <svg id="theme-icon" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2">
        <!-- Ícone preenchido via JS -->
      </svg>
    </button>
  </header>

  <main class="container">
    <!-- Barra de Busca e Filtros -->
    <div class="search-bar">
      <div class="input-wrapper">
        <input type="text" id="search-input" placeholder="Buscar palavra...">
        <button id="btn-clear-search" class="btn-clear-input" title="Limpar busca" aria-label="Limpar busca">×</button>
      </div>
      <button id="btn-favorites-filter" class="btn-icon" title="Filtrar Favoritas" aria-label="Favoritas">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
          <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>
        </svg>
      </button>
    </div>

    <!-- Cartão Principal da Palavra -->
    <div class="word-card">
      <button id="btn-favorite" class="btn-favorite" title="Favoritar" aria-label="Favoritar">
        <svg id="fav-icon" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2">
          <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>
        </svg>
      </button>
      <div class="word-content">
        <h2 id="word-en">Carregando...</h2>
        <p id="word-pt"></p>
      </div>
      <div class="word-counter" id="word-counter">0 / 0</div>
    </div>

    <!-- Painel de Resultados da Busca -->
    <div id="search-results" class="search-results hidden"></div>
  </main>

  <!-- Rodapé com Botões de Ação Baseados em Ícones -->
  <footer class="action-footer">
    <button id="btn-export" class="btn-icon btn-action" title="Exportar Palavra" aria-label="Exportar">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
        <polyline points="7 10 12 15 17 10"/>
        <line x1="12" y1="15" x2="12" y2="3"/>
      </svg>
    </button>

    <!-- Botão Copiar Principal (Mão Aberta) -->
    <button id="btn-copy" class="btn-copy-main" title="Copiar Palavra e Significado" aria-label="Copiar">
      <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M18 11V6a2 2 0 0 0-2-2v0a2 2 0 0 0-2 2v0"/>
        <path d="M14 10V4a2 2 0 0 0-2-2v0a2 2 0 0 0-2 2v6"/>
        <path d="M10 10.5V6a2 2 0 0 0-2-2v0a2 2 0 0 0-2 2v8"/>
        <path d="M18 8a2 2 0 0 1 2 2v4a8 8 0 0 1-8 8h-2c-2.8 0-4.5-.86-5.99-2.34l-3.6-3.6a2 2 0 0 1 2.83-2.82L7 15"/>
      </svg>
    </button>

    <!-- Botão Próximo (Dedo Indicador Deslizante + Hachuras de Movimento) -->
    <button id="btn-next" class="btn-icon btn-action" title="Próxima Palavra (Deslizar)" aria-label="Próxima">
      <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <!-- Hachuras/Linhas de Movimento de Deslize -->
        <path d="M 14 3 C 17 4.5, 17 7.5, 14 9" stroke-dasharray="1 1.5"/>
        <path d="M 17 2 C 21 4, 21 9, 17 11"/>
        
        <!-- Mão com Indicador Estendido -->
        <path d="M 11 8.5 V 4.5 C 11 3.4 10.1 2.5 9 2.5 C 7.9 2.5 7 3.4 7 4.5 V 13.5"/>
        <path d="M 7 10 C 6.5 9.4 5.7 9 4.8 9 C 3.5 9 2.5 10 2.5 11.3 C 2.5 14.5 5.5 18 8 20.5 C 9.5 22 12 22 14.5 22 C 18 22 20.5 19.5 20.5 16 V 12.5 C 20.5 11.4 19.6 10.5 18.5 10.5 C 17.8 10.5 17.2 10.8 16.8 11.3 C 16.3 10.5 15.4 10 14.3 10 C 13.7 10 13.1 10.2 12.7 10.6 C 12.2 9.9 11.4 9.5 10.5 9.5"/>
      </svg>
    </button>
  </footer>

  <script src="script.js"></script>
</body>
</html>
